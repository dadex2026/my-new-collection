<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>%COLLECTION_NAME%</title>

  <style>
    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      /* Offsets EVERY in-page scroll landing point by the sticky nav bar's
         height — not just the four .section-nav-link anchors, but also the
         pre-existing sidebar's scrollIntoView() calls (Rewards/News/
         Methodology), which would have the same problem now that a sticky
         bar exists. Without this, whatever sits at the very top of a
         section — Content's ALL/NEWS/UPDATE/... tab row, Collections'
         filter header, a section title — lands underneath the sticky bar
         instead of just below it. One global offset covers every section
         uniformly; a per-element scroll-margin-top would need updating
         every time a section's own top content changes. ~54px measured nav
         height (10px padding top/bottom + ~34px content row) plus a small
         gap so content doesn't sit flush against the bar.
         Keep in sync with .section-nav's actual rendered height if its
         padding/font-size ever changes. */
      scroll-padding-top: 76px;
    }

    body {
      margin: 0;
      padding: 40px;
      background: #101010;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    #app {
      max-width: 1100px;
      margin: auto;
    }

    h1 { margin-top: 0; }

    .panel {
      margin-bottom: 16px;
      padding: 12px;
      background: #1b1b1b;
      border-radius: 8px;
    }

    button {
      padding: 10px 16px;
      margin-right: 8px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .status-success { color: #6dd96d; }
    .status-error { color: #ff6b6b; }

    .registry-layout {
      display: flex;
      gap: 24px;
      margin-top: 24px;
    }

    .sidebar {
      width: 200px;
      flex-shrink: 0;
    }

    .sidebar-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #666;
      margin-bottom: 8px;
      padding-left: 4px;
    }

    .sidebar-item {
      padding: 10px 12px;
      border-radius: 6px;
      cursor: pointer;
      color: #aaa;
      font-size: 14px;
      margin-bottom: 4px;
      border: 1px solid transparent;
      transition: all 0.15s;
    }

    .sidebar-item:hover {
      background: #1f1f1f;
      color: #fff;
    }

    .sidebar-item.active {
      background: #1f1f1f;
      border-color: #444;
      color: #fff;
    }

    .sidebar-divider {
      border-top: 1px solid #2a2a2a;
      margin: 16px 0;
    }

    .sidebar-filter-group {
      margin-bottom: 12px;
    }

    .sidebar-filter-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #666;
      margin-bottom: 4px;
      padding-left: 4px;
    }

    .sidebar-filter-item {
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      color: #aaa;
      font-size: 13px;
      margin-bottom: 2px;
      border: 1px solid transparent;
      transition: all 0.15s;
    }

    .sidebar-filter-item:hover {
      background: #1f1f1f;
      color: #fff;
    }

    .sidebar-filter-item.active {
      background: #512da8;
      border-color: #512da8;
      color: #fff;
    }

    .sidebar-clear {
      font-size: 11px;
      color: #555;
      cursor: pointer;
      padding: 6px 12px;
      margin-top: 8px;
    }

    .sidebar-clear:hover {
      color: #aaa;
    }

    .drop-panel {
      flex: 1;
      min-width: 0;
    }

    .drops {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .drop {
      background: #1f1f1f;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 12px;
    }

    .drop img {
      width: 100%;
      border-radius: 6px;
      margin-bottom: 10px;
    }

    .drop-name {
      font-weight: bold;
      margin-bottom: 4px;
    }

    .drop-desc {
      font-size: 13px;
      color: #888;
      margin-bottom: 8px;
    }

    .drop-attrs-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #666;
      margin-bottom: 4px;
    }

    .drop-attrs {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 10px;
    }

    .drop-attr {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      background: #2a2a2a;
      color: #888;
      border: 1px solid #333;
    }

    .drop-price {
      color: #aaa;
      font-size: 14px;
      margin-bottom: 4px;
    }

    .drop-minted {
      font-size: 12px;
      color: #666;
      margin-bottom: 6px;
    }

    .drop-status {
      font-size: 12px;
      color: #888;
      margin-bottom: 10px;
    }

    .drop-mint-btn {
      width: 100%;
      padding: 10px;
      background: #512da8;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      margin-right: 0;
    }

    .drop-mint-btn:hover:not(:disabled) {
      background: #6a3fcb;
    }

    .drop-mint-btn:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .empty {
      color: #555;
      font-size: 14px;
      padding: 24px 0;
    }

    .campaigns-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #666;
      margin: 24px 0 8px;
      padding-left: 4px;
    }

    .campaigns-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .campaign {
      background: #1f1f1f;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 12px;
    }

    .campaign img {
      width: 100%;
      border-radius: 6px;
      margin-bottom: 10px;
    }

    .campaign-title {
      font-weight: bold;
      margin-bottom: 4px;
    }

    .campaign-headline {
      color: #aaa;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .campaign-desc,
    .campaign-eligibility,
    .campaign-reward {
      font-size: 13px;
      color: #888;
      margin-bottom: 6px;
    }

    .campaign-price {
      color: #aaa;
      font-size: 14px;
      margin-bottom: 4px;
    }

    .campaign-allocation {
      font-size: 12px;
      color: #666;
      margin-bottom: 10px;
    }

    .campaign-sold-out {
      font-size: 13px;
      color: #ff6b6b;
      padding: 10px 0;
      text-align: center;
    }

    .campaign-claim-btn {
      width: 100%;
      padding: 10px;
      background: #512da8;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      margin-right: 0;
    }

    .campaign-claim-btn:hover:not(:disabled) {
      background: #6a3fcb;
    }

    .campaign-claim-btn:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .drop-panel-header {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 16px;
    }

    .collection-filter {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #171717;
      border: 1px solid #512da8;
      border-radius: 8px;
      padding: 6px 8px 6px 14px;
    }

    .collection-filter-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #b899f0;
      white-space: nowrap;
    }

    .collection-select {
      background: #232323;
      color: #fff;
      border: 1px solid #512da8;
      border-radius: 6px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .collection-select:hover {
      background: #2c2c2c;
      border-color: #6a3fcb;
    }

    .collection-select:focus {
      outline: 2px solid #6a3fcb;
      outline-offset: 1px;
    }

    .pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 20px;
    }

    .pagination-ellipsis {
      color: #555;
      font-size: 13px;
      padding: 6px 4px;
      user-select: none;
    }

    .pagination-arrow,
    .pagination-num {
      background: #1a1a1a;
      color: #aaa;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .pagination-arrow:hover,
    .pagination-num:hover {
      background: #1f1f1f;
      color: #fff;
    }

    .pagination-num.active {
      background: #512da8;
      border-color: #512da8;
      color: #fff;
    }

    .pagination-arrow:disabled {
      opacity: .35;
      cursor: not-allowed;
    }

    .textcards-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #666;
      margin: 24px 0 8px;
      padding-left: 4px;
    }

    .textcards-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 16px;
    }

    .textcards-tab {
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      color: #aaa;
      font-size: 12px;
      border: 1px solid #333;
      transition: all 0.15s;
    }

    .textcards-tab:hover {
      background: #1f1f1f;
      color: #fff;
    }

    .textcards-tab.active {
      background: #512da8;
      border-color: #512da8;
      color: #fff;
    }

    .textcards-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    /* Below this width, 3 fixed columns get too cramped — fall back to
       auto-fill so cards keep a sane minimum width and wrap naturally.
       These three selectors are deliberately the ONLY responsive rule in
       this file (there were none before); keep new grid tweaks paired
       with an update here so mobile doesn't regress. */
    @media (max-width: 720px) {
      .drops,
      .campaigns-grid,
      .textcards-grid {
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      }
    }

    .textcard {
      background: #1f1f1f;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 12px;
    }

    .textcard-category {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #666;
      margin-bottom: 6px;
    }

    .textcard-headline {
      font-weight: bold;
      margin-bottom: 4px;
    }

    .textcard-subheadline {
      color: #aaa;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .textcard-body {
      font-size: 13px;
      color: #888;
      margin-bottom: 10px;
    }

    .textcard-entries {
      list-style: none;
      padding-left: 0;
      margin: 0 0 10px;
      font-size: 13px;
      color: #ccc;
    }

    /* Structured entries whose rows agree on their keys render as a table:
       one header instead of the key repeated per line, and columns that line
       up so a score or rank can be scanned down. Scrolls inside its own
       container so a wide board never pushes the card sideways. */
    .textcard-table-wrap {
      overflow-x: auto;
      margin: 0 0 10px;
    }

    .textcard-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      font-variant-numeric: tabular-nums;
    }

    .textcard-table th {
      text-align: left;
      font-weight: 500;
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #666;
      padding: 0 10px 5px 0;
      border-bottom: 1px solid #2a2a2a;
      white-space: nowrap;
    }

    .textcard-table td {
      padding: 5px 10px 5px 0;
      color: #ccc;
      border-bottom: 1px solid #1c1c1c;
      white-space: nowrap;
    }

    .textcard-table tbody tr:last-child td {
      border-bottom: none;
    }

    .textcard-table th:last-child,
    .textcard-table td:last-child {
      padding-right: 0;
    }

    .textcard-entry {
      margin-bottom: 4px;
    }

    .textcard-entry-field {
      margin-right: 10px;
      color: #aaa;
    }

    .textcard-stats {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 10px;
    }

    .textcard-stat {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
    }

    .textcard-stat-label {
      color: #666;
    }

    .textcard-stat-value {
      color: #ccc;
    }

    /* Methodology. Prose measure is held near 70 characters — this is the one
       section on the page meant to be read rather than scanned. */
    #methodology {
      margin-top: 40px;
      padding-top: 24px;
      border-top: 1px solid #2a2a2a;
    }

    .method-title {
      font-size: 18px;
      color: #ddd;
      margin-bottom: 8px;
    }

    .method-intro {
      font-size: 13px;
      color: #999;
      max-width: 70ch;
      margin: 0 0 24px;
      line-height: 1.6;
    }

    .method-section { margin-bottom: 22px; }

    .method-heading {
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #666;
      margin-bottom: 8px;
    }

    .method-body {
      font-size: 13px;
      color: #aaa;
      max-width: 70ch;
      margin: 0 0 10px;
      line-height: 1.65;
    }

    .method-list {
      list-style: none;
      padding: 0;
      margin: 0;
      font-size: 13px;
      color: #aaa;
      max-width: 70ch;
    }

    .method-list li {
      padding: 8px 0;
      border-bottom: 1px solid #1c1c1c;
      line-height: 1.55;
    }

    .method-list li:last-child { border-bottom: none; }

    .method-note {
      font-size: 12px;
      color: #777;
      max-width: 70ch;
      margin: 6px 0 0;
      line-height: 1.55;
    }

    .method-version {
      font-family: 'Space Mono', ui-monospace, monospace;
      font-size: 11px;
      color: #888;
    }

    .method-kind {
      font-family: 'Space Mono', ui-monospace, monospace;
      font-size: 10px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 2px 6px;
      border: 1px solid #333;
      border-radius: 3px;
      color: #888;
      margin-left: 6px;
    }

    /* Only a rule change moves numbers, so only it is marked. */
    .method-kind-rule-change { color: #c9a227; border-color: #5a4a1a; }

    .method-date { font-size: 11px; color: #666; margin-left: 6px; }

    .method-generated {
      font-size: 11px;
      color: #555;
      margin-top: 22px;
      padding-top: 12px;
      border-top: 1px solid #1c1c1c;
    }

    /* Says what the card left out. A ranked board shown ten rows deep looks
       identical to a board that only has ten rows without it. */
    .textcard-truncation {
      font-size: 11px;
      color: #666;
      margin: 0 0 10px;
    }

    .textcard-meta {
      display: flex;
      gap: 10px;
      font-size: 11px;
      color: #555;
    }

    /* Top section nav + search. Sticky so it stays reachable on a long page
       — the whole reason for it existing is getting back to a section (or
       re-searching) without scrolling up. Links are plain #anchor jumps into
       existing sections; html{scroll-behavior:smooth} above is what makes
       them animate instead of jumping instantly. */
    .section-nav {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin: 0 0 16px;
      padding: 10px 14px;
      background: #101010;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
    }

    .section-nav-links {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    /* Solid purple/white, matching .drop-mint-btn and .pagination-num.active
       rather than the muted pill these started as — these are primary
       navigation actions, so they read as buttons, not as secondary chrome. */
    .section-nav-link {
      padding: 6px 14px;
      border-radius: 20px;
      background: #512da8;
      color: #fff;
      font-size: 13px;
      border: 1px solid #512da8;
      transition: all 0.15s;
    }

    .section-nav-link:hover {
      background: #6a3fcb;
      border-color: #6a3fcb;
      color: #fff;
      text-decoration: none;
    }

    /* Current section. Same lighter purple as the mint button's hover, plus a
       pale ring — the background alone can't distinguish it now that the
       resting state is already purple. */
    .section-nav-link.active {
      background: #6a3fcb;
      border-color: #b9a3f0;
      color: #fff;
    }

    .section-search {
      background: #232323;
      color: #fff;
      border: 1px solid #512da8;
      border-radius: 6px;
      padding: 8px 14px;
      font-size: 13px;
      min-width: 200px;
    }

    .section-search:focus {
      outline: 2px solid #6a3fcb;
      outline-offset: 1px;
    }

    @media (max-width: 720px) {
      .section-nav {
        flex-direction: column;
        align-items: stretch;
      }

      .section-search {
        min-width: 0;
      }
    }
  </style>
</head>

<body>

<div id="app">

  <h1>%COLLECTION_NAME%</h1>

  <nav id="section-nav" class="section-nav">
    <div class="section-nav-links">
      <a href="#registry" class="section-nav-link">Collections</a>
      <a href="#campaigns" class="section-nav-link">Campaigns</a>
      <a href="#textcards" class="section-nav-link">Content</a>
      <a href="#methodology" class="section-nav-link">Rankings</a>
      <a href="#app" class="section-nav-link">&uarr; Top</a>
    </div>
    <input
      type="search"
      id="section-search"
      class="section-search"
      placeholder="Search this page…"
      autocomplete="off"
    />
  </nav>

  <div id="wallet" class="panel">
    Wallet: Not connected
  </div>

  <div id="status" class="panel">
    Ready
  </div>

  <div class="panel">
    <button data-action="connect-wallet">Connect Wallet</button>
    <button data-action="disconnect-wallet">Disconnect</button>
  </div>

  <div id="registry" class="registry-layout">
    <p>Loading registry...</p>
  </div>

  <div id="campaigns"></div>

  <div id="textcards"></div>

  <div id="methodology"></div>

</div>

<script type="module" src="/src/main.ts"></script>

</body>
</html>
