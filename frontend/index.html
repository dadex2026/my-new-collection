<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Template Open Edition</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 40px;
      background: #101010;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    #app {
      max-width: 1100px;
      margin: auto;
    }

    h1 { margin-top: 0; }

    .panel {
      margin-bottom: 16px;
      padding: 12px;
      background: #1b1b1b;
      border-radius: 8px;
    }

    button {
      padding: 10px 16px;
      margin-right: 8px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .status-success { color: #6dd96d; }
    .status-error { color: #ff6b6b; }

    .registry-layout {
      display: flex;
      gap: 24px;
      margin-top: 24px;
    }

    .sidebar {
      width: 200px;
      flex-shrink: 0;
    }

    .sidebar-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #666;
      margin-bottom: 8px;
      padding-left: 4px;
    }

    .sidebar-item {
      padding: 10px 12px;
      border-radius: 6px;
      cursor: pointer;
      color: #aaa;
      font-size: 14px;
      margin-bottom: 4px;
      border: 1px solid transparent;
      transition: all 0.15s;
    }

    .sidebar-item:hover {
      background: #1f1f1f;
      color: #fff;
    }

    .sidebar-item.active {
      background: #1f1f1f;
      border-color: #444;
      color: #fff;
    }

    .sidebar-divider {
      border-top: 1px solid #2a2a2a;
      margin: 16px 0;
    }

    .sidebar-filter-group {
      margin-bottom: 12px;
    }

    .sidebar-filter-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #666;
      margin-bottom: 4px;
      padding-left: 4px;
    }

    .sidebar-filter-item {
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      color: #aaa;
      font-size: 13px;
      margin-bottom: 2px;
      border: 1px solid transparent;
      transition: all 0.15s;
    }

    .sidebar-filter-item:hover {
      background: #1f1f1f;
      color: #fff;
    }

    .sidebar-filter-item.active {
      background: #512da8;
      border-color: #512da8;
      color: #fff;
    }

    .sidebar-clear {
      font-size: 11px;
      color: #555;
      cursor: pointer;
      padding: 6px 12px;
      margin-top: 8px;
    }

    .sidebar-clear:hover {
      color: #aaa;
    }

    .drop-panel {
      flex: 1;
      min-width: 0;
    }

    .drops {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .drop {
      background: #1f1f1f;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 12px;
    }

    .drop img {
      width: 100%;
      border-radius: 6px;
      margin-bottom: 10px;
    }

    .drop-name {
      font-weight: bold;
      margin-bottom: 4px;
    }

    .drop-desc {
      font-size: 13px;
      color: #888;
      margin-bottom: 8px;
    }

    .drop-attrs-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #666;
      margin-bottom: 4px;
    }

    .drop-attrs {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 10px;
    }

    .drop-attr {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      background: #2a2a2a;
      color: #888;
      border: 1px solid #333;
    }

    .drop-price {
      color: #aaa;
      font-size: 14px;
      margin-bottom: 4px;
    }

    .drop-minted {
      font-size: 12px;
      color: #666;
      margin-bottom: 6px;
    }

    .drop-status {
      font-size: 12px;
      color: #888;
      margin-bottom: 10px;
    }

    .drop-mint-btn {
      width: 100%;
      padding: 10px;
      background: #512da8;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      margin-right: 0;
    }

    .drop-mint-btn:hover:not(:disabled) {
      background: #6a3fcb;
    }

    .drop-mint-btn:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .empty {
      color: #555;
      font-size: 14px;
      padding: 24px 0;
    }

    .campaigns-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #666;
      margin: 24px 0 8px;
      padding-left: 4px;
    }

    .campaigns-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .campaign {
      background: #1f1f1f;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 12px;
    }

    .campaign img {
      width: 100%;
      border-radius: 6px;
      margin-bottom: 10px;
    }

    .campaign-title {
      font-weight: bold;
      margin-bottom: 4px;
    }

    .campaign-headline {
      color: #aaa;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .campaign-desc,
    .campaign-eligibility,
    .campaign-reward {
      font-size: 13px;
      color: #888;
      margin-bottom: 6px;
    }

    .campaign-price {
      color: #aaa;
      font-size: 14px;
      margin-bottom: 4px;
    }

    .campaign-allocation {
      font-size: 12px;
      color: #666;
      margin-bottom: 10px;
    }

    .campaign-sold-out {
      font-size: 13px;
      color: #ff6b6b;
      padding: 10px 0;
      text-align: center;
    }

    .campaign-claim-btn {
      width: 100%;
      padding: 10px;
      background: #512da8;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      margin-right: 0;
    }

    .campaign-claim-btn:hover:not(:disabled) {
      background: #6a3fcb;
    }

    .campaign-claim-btn:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .drop-panel-header {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 16px;
    }

    .collection-filter {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #171717;
      border: 1px solid #512da8;
      border-radius: 8px;
      padding: 6px 8px 6px 14px;
    }

    .collection-filter-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #b899f0;
      white-space: nowrap;
    }

    .collection-select {
      background: #232323;
      color: #fff;
      border: 1px solid #512da8;
      border-radius: 6px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .collection-select:hover {
      background: #2c2c2c;
      border-color: #6a3fcb;
    }

    .collection-select:focus {
      outline: 2px solid #6a3fcb;
      outline-offset: 1px;
    }

    .pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 20px;
    }

    .pagination-arrow,
    .pagination-num {
      background: #1a1a1a;
      color: #aaa;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .pagination-arrow:hover,
    .pagination-num:hover {
      background: #1f1f1f;
      color: #fff;
    }

    .pagination-num.active {
      background: #512da8;
      border-color: #512da8;
      color: #fff;
    }

    .pagination-arrow:disabled {
      opacity: .35;
      cursor: not-allowed;
    }

    .textcards-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #666;
      margin: 24px 0 8px;
      padding-left: 4px;
    }

    .textcards-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 16px;
    }

    .textcards-tab {
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      color: #aaa;
      font-size: 12px;
      border: 1px solid #333;
      transition: all 0.15s;
    }

    .textcards-tab:hover {
      background: #1f1f1f;
      color: #fff;
    }

    .textcards-tab.active {
      background: #512da8;
      border-color: #512da8;
      color: #fff;
    }

    .textcards-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    /* Below this width, 3 fixed columns get too cramped — fall back to
       auto-fill so cards keep a sane minimum width and wrap naturally.
       These three selectors are deliberately the ONLY responsive rule in
       this file (there were none before); keep new grid tweaks paired
       with an update here so mobile doesn't regress. */
    @media (max-width: 720px) {
      .drops,
      .campaigns-grid,
      .textcards-grid {
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      }
    }

    .textcard {
      background: #1f1f1f;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 12px;
    }

    .textcard-category {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #666;
      margin-bottom: 6px;
    }

    .textcard-headline {
      font-weight: bold;
      margin-bottom: 4px;
    }

    .textcard-subheadline {
      color: #aaa;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .textcard-body {
      font-size: 13px;
      color: #888;
      margin-bottom: 10px;
    }

    .textcard-entries {
      list-style: decimal;
      padding-left: 18px;
      margin: 0 0 10px;
      font-size: 13px;
      color: #ccc;
    }

    .textcard-entry {
      margin-bottom: 4px;
    }

    .textcard-entry-field {
      margin-right: 10px;
      color: #aaa;
    }

    .textcard-stats {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 10px;
    }

    .textcard-stat {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
    }

    .textcard-stat-label {
      color: #666;
    }

    .textcard-stat-value {
      color: #ccc;
    }

    .textcard-meta {
      display: flex;
      gap: 10px;
      font-size: 11px;
      color: #555;
    }
  </style>
</head>

<body>

<div id="app">

  <h1>Template Open Edition</h1>

  <div id="wallet" class="panel">
    Wallet: Not connected
  </div>

  <div id="status" class="panel">
    Ready
  </div>

  <div class="panel">
    <button data-action="connect-wallet">Connect Wallet</button>
    <button data-action="disconnect-wallet">Disconnect</button>
  </div>

  <div id="registry" class="registry-layout">
    <p>Loading registry...</p>
  </div>

  <div id="campaigns"></div>

  <div id="textcards"></div>

</div>

<script type="module" src="/src/main.ts"></script>

</body>
</html>
